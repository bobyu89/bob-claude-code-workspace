name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # oldest and newest supported Python; R is installed so the R/Python cross-checks run.
        # The "no R" fallback is covered by tests that clear PATH.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # base R only; aistat needs no CRAN packages
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install aistat
        run: python -m pip install -e ".[dev,mcp]"

      - name: Show engines
        run: |
          python --version
          Rscript --version

      - name: Run tests
        env:
          AISTAT_REQUIRE_R: "1"
        run: python -m pytest -q -ra
